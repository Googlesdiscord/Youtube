<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to WhatsApp</title>
    <script>
        // Automatically redirect to WhatsApp on page load
        window.onload = function() {
            const phone = "6281221412"; // Replace with your WhatsApp number
            const message = "Hi"; // The predefined message
            const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
            window.location.href = url;
        };
    </script>
</head>
<body>
    <h1>Redirecting you to WhatsApp...</h1>
    <p>If you are not redirected automatically, <a id="redirect-link">click here</a>.</p>
</body>
</html>
