<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Message Button</title>
    <script>
        // This function copies the predefined message to the clipboard
        function copyToClipboard() {
            const message = "Hello! I'd like to learn more about your product.";
            navigator.clipboard.writeText(message).then(() => {
                alert("Message copied to clipboard!");
            });
        }

        // This function redirects the user to WhatsApp with the message
        function sendMessage() {
            const phone = "9030390877"; // Replace with your WhatsApp number
            const message = "Hello! I'd like to learn more about your product.";
            window.location.href = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
        }
    </script>
</head>
<body>
    <button onclick="copyToClipboard(); sendMessage();">Contact Us on WhatsApp</button>
</body>
</html>
